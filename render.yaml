services:
  - type: web
    name: fasocarnet-cloud-api
    env: node
    buildCommand: npm install && npm run build && cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SHOP_AUTH_SECRET_SEED
        value: FASO_CARNET_SHOP_AUTH_TOKEN_SEED_2026
    disk:
      name: fasocarnet-data
      mountPath: /app/server/data
      sizeGB: 1
