name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Ensure Signing Keystore Exists
        run: |
          if [ ! -f android/app/fasocarnet-release.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/fasocarnet-release.keystore \
              -alias fasocarnet \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass fasocarnet2026 \
              -keypass fasocarnet2026 \
              -dname "CN=FasoCarnet, OU=App, O=FasoCarnet, L=Ouagadougou, ST=Kadiogo, C=BF"
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release Files
        run: |
          mkdir -p release_assets
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ Aucun APK généré !"
            exit 1
          fi
          echo "✅ APK trouvé: $APK_FILE"
          cp "$APK_FILE" release_assets/FasoCarnet-v1.2.4-Android.apk
          cp "$APK_FILE" release_assets/fasocarnet-release.apk
          ls -lh release_assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FasoCarnet-v1.2.4-Android-APK
          path: release_assets/FasoCarnet-v1.2.4-Android.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.2.4
          name: "FasoCarnet v1.2.4 - Version Officielle Android"
          body: |
            ### 🇧🇫 FasoCarnet v1.2.4 - Application Android Officielle

            - ✅ **Gestion de Stock complète** : Saisie quantité, alertes stock critique (≤ 5), décompte auto en caisse & réapprovisionnement express.
            - ✅ **Interface Administrateur optimisée** : Vue mobile/tablette, relances WhatsApp groupées en 1 clic.
            - ✅ **Caisse tactile & Hors-ligne 100%** : Ventes au comptant & à crédit, monnaie instantanée.
            - ✅ **Scanner Code-Barres & Reçus WhatsApp** : Caméra intégrée et tickets thermiques Bluetooth.
          files: |
            release_assets/FasoCarnet-v1.2.4-Android.apk
            release_assets/fasocarnet-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
