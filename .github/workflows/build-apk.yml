name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Signing Keystore
        run: |
          rm -f android/app/fasocarnet-release.keystore
          keytool -genkeypair -v \
            -keystore android/app/fasocarnet-release.keystore \
            -alias fasocarnet \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass fasocarnet2026 \
            -keypass fasocarnet2026 \
            -dname "CN=FasoCarnet, OU=App, O=FasoCarnet, L=Ouagadougou, ST=Kadiogo, C=BF"

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          rm -f android/app/src/main/assets/public/dist.zip

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== GRADLE LOG ERROR START ==="
            tail -n 120 ../gradle.log
            exit 1
          fi
          cd ..
          find android/app/build/outputs/ -type f -name "*.apk"

      - name: Prepare APK Release File
        run: |
          set -e
          mkdir -p release_assets
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ ERREUR: Aucun fichier APK généré !"
            exit 1
          fi
          echo "✅ APK trouvé: $APK_FILE"
          cp "$APK_FILE" release_assets/FasoCarnet-v1.2.3-Android.apk
          ls -lh release_assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FasoCarnet-v1.2.3-Android-APK
          path: release_assets/FasoCarnet-v1.2.3-Android.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release v1.2.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3
          name: "FasoCarnet v1.2.3 - Version Officielle Android"
          body: |
            ### 🇧🇫 FasoCarnet v1.2.3 - Application Android Officielle

            - ✅ Interface d'administration optimisée Mobile & Tablette
            - ✅ Relances WhatsApp groupées en 1 clic (Abonnés essai & payants)
            - ✅ Analytics épuré avec provenance géographique par ville
            - ✅ Sécurité Cloud renforcée et sauvegarde globale
            - ✅ Caisse tactile, hors-ligne 100%, reçus WhatsApp & tickets thermiques
          files: release_assets/FasoCarnet-v1.2.3-Android.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
