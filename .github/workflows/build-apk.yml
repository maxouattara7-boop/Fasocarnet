name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build_log.txt

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-txt
          path: build_log.txt

      - name: Prepare APK Release File
        run: |
          mkdir -p release_assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release_assets/FasoCarnet-v1.2.0-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FasoCarnet-v1.2.0-Android-APK
          path: release_assets/FasoCarnet-v1.2.0-Android.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release v1.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "FasoCarnet v1.2.0 - Version Officielle Android"
          body: |
            ### 🇧🇫 FasoCarnet v1.2.0 - Application Android Officielle

            - ✅ Caisse tactile & calcul instantané
            - ✅ 100% Fonctionnel hors-ligne
            - ✅ Reçus WhatsApp & impression thermique Bluetooth
            - ✅ Carnet des dettes & relances clients en 1 clic
            - ✅ 10 jours d'essai gratuit
          files: release_assets/FasoCarnet-v1.2.0-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
