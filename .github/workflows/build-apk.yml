name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Ensure Signing Keystore Exists
        run: |
          if [ ! -f android/app/fasocarnet-release.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/fasocarnet-release.keystore \
              -alias fasocarnet \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass fasocarnet2026 \
              -keypass fasocarnet2026 \
              -dname "CN=FasoCarnet, OU=App, O=FasoCarnet, L=Ouagadougou, ST=Kadiogo, C=BF"
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release Files
        run: |
          mkdir -p release_assets
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ Aucun APK généré !"
            exit 1
          fi
          echo "✅ APK trouvé: $APK_FILE"
          cp "$APK_FILE" release_assets/FasoCarnet-v1.2.6-Android.apk
          cp "$APK_FILE" release_assets/fasocarnet-release.apk
          cp dist.zip release_assets/dist.zip || true
          ls -lh release_assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FasoCarnet-v1.2.6-Android-APK
          path: release_assets/FasoCarnet-v1.2.6-Android.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.2.6
          name: "FasoCarnet v1.2.6 - Version Officielle Android"
          body: |
            ### 🇧🇫 FasoCarnet v1.2.6 - Application Android Officielle

            - ✅ **Calculatrice tactile TPV Grand Format (64-72px)** : Ergonomie mobile optimisée pour saisir les montants rapidement.
            - ✅ **Dettes & Débiteurs** : Disparition automatique des dettes soldées et suppression sécurisée.
            - ✅ **Bilan Mensuel & Journalier** : Vue mensuelle complète et affichage précis des ventes du jour sélectionné.
            - ✅ **Mises à jour OTA instantanées** : CDN haute vitesse pour une application fluide des nouveautés.
          files: |
            release_assets/FasoCarnet-v1.2.6-Android.apk
            release_assets/fasocarnet-release.apk
            dist.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
